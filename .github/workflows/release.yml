name: Release delivery gate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behavior:
    uses: ./.github/workflows/ci.yml
  delivery:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Qualify the actual Windows editor delivery
        id: qualify
        shell: pwsh
        run: ./scripts/check-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-windows-candidate
          if-no-files-found: error
          path: |
            ${{ steps.qualify.outputs.directory }}/NovellMaker-win-x64.zip
            ${{ steps.qualify.outputs.directory }}/qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-evidence
          path: |
            artifacts/release/**/TestResults/
            artifacts/release/**/evidence/
  release:
    needs: [behavior, delivery]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qualified-windows-candidate
          path: candidate
      - name: Verify candidate identity and bytes
        shell: pwsh
        run: |
          $evidence = Get-Content candidate/qualification.json -Raw | ConvertFrom-Json
          if ($evidence.worktreeDirty) { throw 'Candidate was built from a dirty worktree.' }
          if ($evidence.commit -ne $env:GITHUB_SHA) { throw 'Candidate belongs to a different commit.' }
          if ((Get-FileHash candidate/NovellMaker-win-x64.zip -Algorithm SHA256).Hash -ne $evidence.sha256) { throw 'Candidate archive changed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-ready-win-x64
          if-no-files-found: error
          path: candidate/
      - name: Publish qualified tag as a draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes candidate/NovellMaker-win-x64.zip candidate/qualification.json
