name: Release delivery gate

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (must match Directory.Build.props)'
        required: true
        default: v0.1.0-beta.1
      repair_empty_release:
        description: 'Move an empty beta tag to this commit and restore its draft'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag and repair an explicitly selected empty release
        id: prepare
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REPAIR_EMPTY: ${{ inputs.repair_empty_release }}
        run: |
          [xml]$properties = Get-Content Directory.Build.props -Raw
          $tag = if ($env:GITHUB_REF.StartsWith('refs/tags/')) { $env:GITHUB_REF_NAME } else { $env:REQUESTED_TAG }
          if ($tag -ne "v$($properties.Project.PropertyGroup.Version)") { throw 'Release tag does not match the application version.' }
          $reference = gh api "repos/$env:GH_REPO/git/ref/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release tag.' }
          $object = $reference.object
          while ($object.type -eq 'tag') {
            $annotated = gh api "repos/$env:GH_REPO/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect annotated tag.' }
            $object = $annotated.object
          }
          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect releases.' }
          $existing = $null
          if (@($releases | Where-Object tagName -eq $tag).Count -gt 0) {
            $existing = gh release view $tag --json assets,isDraft | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release assets.' }
          }
          if ($object.sha -ne $env:GITHUB_SHA) {
            if ($env:REPAIR_EMPTY -ne 'true' -or $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') { throw 'Tag points to a different commit. Select explicit empty-release repair or use a new version.' }
            if ($existing -and @($existing.assets).Count -gt 0) { throw 'Refusing to move a tag with downloadable release files.' }
            git push "--force-with-lease=refs/tags/${tag}:$($reference.object.sha)" origin "HEAD:refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Tag changed concurrently or cannot be updated.' }
          }
          if ($existing -and -not $existing.isDraft -and @($existing.assets).Count -eq 0) {
            gh release edit $tag --draft --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Cannot restore empty release draft.' }
          }
          "tag=$tag" | Add-Content $env:GITHUB_OUTPUT
  behavior:
    needs: prepare-release
    uses: ./.github/workflows/ci.yml
  delivery:
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      GALLIUM_DRIVER: llvmpipe
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Cache pinned NSIS archive
        uses: actions/cache@v4
        with:
          path: artifacts/build-tools/nsis-3.13.zip
          key: nsis-3.13-BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8
      - name: Install software OpenGL on the ephemeral Windows runner
        uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3
        with:
          version: '26.0.3'
          build-type: release-msvc
          deployment-choice: '1'
      - name: Qualify the actual Windows editor delivery
        id: qualify
        shell: pwsh
        run: ./scripts/build-release.ps1 -Platform Windows
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-windows-candidate
          if-no-files-found: error
          path: |
            ${{ steps.qualify.outputs.release_directory }}/*-win-x64-Setup.exe
            ${{ steps.qualify.outputs.release_directory }}/*-win-x64-portable.zip
            ${{ steps.qualify.outputs.release_directory }}/qualification-win-x64.json
            ${{ steps.qualify.outputs.release_directory }}/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-evidence
          path: |
            artifacts/release/**/TestResults/
            artifacts/release/**/evidence/
  linux:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Build experimental Linux editor and preview
        id: package
        shell: pwsh
        run: ./scripts/build-release.ps1 -Platform Linux
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-linux-candidate
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.release_directory }}/*-linux-x64-experimental.tar.gz
            ${{ steps.package.outputs.release_directory }}/build-linux-x64.json
  release:
    needs: [prepare-release, behavior, delivery, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qualified-windows-candidate
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: experimental-linux-candidate
          path: linux-candidate
      - name: Verify candidate identity and bytes
        shell: pwsh
        run: |
          $evidence = Get-Content candidate/qualification-win-x64.json -Raw | ConvertFrom-Json
          if ($evidence.worktreeDirty) { throw 'Candidate was built from a dirty worktree.' }
          if ($evidence.commit -ne $env:GITHUB_SHA) { throw 'Candidate belongs to a different commit.' }
          if ((Get-FileHash (Join-Path candidate $evidence.archive) -Algorithm SHA256).Hash -ne $evidence.sha256) { throw 'Candidate archive changed.' }
          if ((Get-FileHash (Join-Path candidate $evidence.installer) -Algorithm SHA256).Hash -ne $evidence.installerSha256) { throw 'Editor installer changed.' }
          $linux = Get-Content linux-candidate/build-linux-x64.json -Raw | ConvertFrom-Json
          if ((Get-FileHash (Join-Path linux-candidate $linux.archive) -Algorithm SHA256).Hash -ne $linux.sha256) { throw 'Linux archive changed.' }
          $files = @(Get-ChildItem candidate,linux-candidate -File | Where-Object { $_.Name -match '\.(exe|zip|tar\.gz)$' })
          $files | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content candidate/SHA256SUMS -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: release-ready-win-x64
          if-no-files-found: error
          path: candidate/
      - name: Publish qualified tag as a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: pwsh
        run: |
          [xml]$properties = Get-Content Directory.Build.props -Raw
          $version = [string]$properties.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag must match the application version.' }
          $notes = Get-Content docs/RELEASE-0.1-beta.md -Raw
          $notes.Replace('](lua-reference/', "](https://github.com/$env:GH_REPO/blob/$env:RELEASE_TAG/docs/lua-reference/") | Set-Content release-notes.md -Encoding utf8
          $files = @(Get-ChildItem candidate,linux-candidate -File |
            Where-Object { $_.Name -match '\.(exe|zip|tar\.gz)$' -or $_.Name -eq 'SHA256SUMS' } | ForEach-Object FullName)
          $existing = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases.' }
          if (@($existing | Where-Object tagName -eq $env:RELEASE_TAG).Count -gt 0) {
            gh release edit $env:RELEASE_TAG --draft --prerelease=$($version.Contains('-').ToString().ToLowerInvariant()) `
              --title "NovellMaker $version" --notes-file release-notes.md --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Cannot update release draft.' }
            gh release upload $env:RELEASE_TAG --clobber @files
            if ($LASTEXITCODE -ne 0) { throw 'Cannot upload qualified release files.' }
          }
          else {
            $arguments = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--draft', '--title', "NovellMaker $version", '--notes-file', 'release-notes.md')
            if ($version.Contains('-')) { $arguments += '--prerelease' }
            gh @arguments @files
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          }
